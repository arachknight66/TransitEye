[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "transiteye"
version = "0.1.0"
description = "Reproducible analysis of noisy TESS astronomical light curves."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "TransitEye contributors" }]
dependencies = [
  "astropy>=6,<8",
  "astroquery>=0.4.11,<1",
  "numpy>=1.26,<3",
]

[project.scripts]
transiteye = "transiteye.__main__:main"

[dependency-groups]
dev = [
  "pre-commit>=3.7,<5",
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/transiteye"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
