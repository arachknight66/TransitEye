[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "transiteye"
version = "0.1.0"
description = "Reproducible analysis of noisy TESS astronomical light curves."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "TransitEye contributors" }]
dependencies = [
  "astropy>=6,<8",
  "astroquery>=0.4.11,<1",
  "batman-package>=2.4,<3",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pyarrow>=16,<27",
  "scikit-learn>=1.4,<2",
  "scipy>=1.13,<2",
  "wotan>=1.10,<3",
]

[project.optional-dependencies]
cuda = [
  "cupy-cuda13x>=14.0,<15",
]
desktop = [
    "pyqt6>=6.7,<7",
    "pyqtgraph>=0.13,<1",
]
torch-cuda = [
  "torch==2.15.0",
]

[project.scripts]
transiteye = "transiteye.__main__:main"
transiteye-desktop = "transiteye_desktop.app:main"

[dependency-groups]
dev = [
  "pre-commit>=3.7,<5",
  "pytest>=8.2,<9",
  "pytest-qt>=4.4,<5",
  "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/transiteye", "desktop/transiteye_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
