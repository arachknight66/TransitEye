config_version: 1
project:
  name: TransitEye
reproducibility:
  master_seed: 42
features:
  policy_version: feature-policy-v1
  generator_version: feature-generator-v1
  enabled_groups: [time_domain, bls, lomb_scargle, fft]
  # Provisional MVP support requirements; sensitivity analysis belongs after B039.
  minimum_in_transit_points: 3
  local_baseline_duration_multiples: 2.0
  bls_peak_neighborhood_fraction: 0.01
  lomb_scargle:
    samples_per_peak: 5
    minimum_cycles_per_baseline: 1.0
    maximum_frequency_per_day: 24.0
    independent_peak_fraction: 0.02
  fft:
    # FFT-only temporary regularization. The saved processed stream is never changed.
    maximum_short_gap_cadences: 2
    minimum_segment_points: 64
    low_band_max_frequency_per_day: 1.0
    mid_band_max_frequency_per_day: 6.0
