    # Provisional future fractions; not applied to the two-TIC development dataset.
    train_fraction: 0.7
    validation_fraction: 0.15
    test_fraction: 0.15
    seed_component: tic_grouped_split
    # TBD: grouped stratification policy after the real cohort is expanded.
    grouped_stratification: none
