[protocol.search]
preprocessing = "prepare_light_curve; two_pass_detrend window 0.75 days"
candidate_policy = "one candidate; BLS SNR threshold 1.5, then 0.5 only if no candidate"
pass2 = "candidate-masked two-pass detrend"
refinement = "refine_candidate with crowdsap and batman_snr_threshold 7.0"
feature_order = "MORPHOLOGY_FEATURE_NAMES from the frozen model artifact"
product_selection = "one latest-sector FITS per source, ordered by sector then local filename"

[protocol.scoring]
classification_metrics = ["accuracy", "macro_f1", "per_class_precision", "per_class_recall", "per_class_f1", "expected_calibration_error", "brier_score", "abstention_rate", "effective_coverage"]
primary_scope = "classification conditional on a candidate feature vector being extracted"
system_scope = "all 96 sources; no-candidate and failed extraction are abstentions and count as incorrect for class recall"
bootstrap_group = "source_group_id"
system_calibration = "not reported; no-candidate/failed rows have no model probabilities"
threshold_tuning = false
model_selection_on_test = false
