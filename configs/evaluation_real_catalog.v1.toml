model_dir = ".transiteye-workspace/models/morphology_real_catalog_v1"
model_id = "morphology_real_catalog_v1"
tau_confidence = 0.4
tau_margin = 0.1
bootstrap_replicates = 1000
bootstrap_seed = 20261030
confidence_interval = 0.95

[protocol.sha256]
runner = "69fdd5f376abc8f456ff0caa0677f8c0b6ae908a3911cf8cb3fad2ae3eef6acf"
labels_manifest = "056ec18f2537383f35c775fbdda37408f3aedb48a2ca7261df01e42181388015"
splits_manifest = "9fe940557d47ec98d7ed6d8e0c27a6b15733164728d106420b31da3e47bf4a79"
