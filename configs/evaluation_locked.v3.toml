# TransitEye Frozen Locked Evaluation Protocol v3.0
# Frozen prior to opening the 5,000-target locked test set.

[protocol]
version = "v3.0"
date_frozen = "2026-10-26"
target_split = "test"
splits_manifest = "manifests/cohort_v3_splits.json"
labels_manifest = "manifests/cohort_v3_labels.json"
pilot_dir = ".transiteye-workspace/data/cohort_v3"
ephemeris_period_tolerance_rel = 0.01
ephemeris_epoch_window_factor = 1.25
harmonic_evaluation_enabled = true
harmonic_multipliers = [0.5, 1.0, 2.0]

[classification]
tau_confidence = 0.40
tau_margin = 0.10
class_names = ["transit_like", "eclipse_like", "stellar_variability", "other_artifact"]

[bootstrap]
n_replicates = 1000
random_seed = 20261026
confidence_interval_alpha = 0.05
grouping_key = "source_group_id"

[ablations]
enabled_variants = [
    "full_system",
    "real_data_only",
    "pass1_detrending_only",
    "drop_variability_features",
    "drop_source_features"
]
